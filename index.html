<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A curated directory of personal and academic websites.">
<title>CT| Personal Website Directory</title>
<style>
:root {
  --bg:#f4f6fb; --surface:#fff; --ink:#172033; --muted:#69758b;
  --line:#e5e9f1; --accent:#4659d9; --accent2:#7182ff;
  --shadow:0 12px 35px rgba(25,39,75,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{background:radial-gradient(circle at 85% 15%,#5368e8 0,transparent 28%),linear-gradient(120deg,#111a35,#263b73);color:white;padding:58px 22px 78px}
.hero-inner,.main{max-width:1160px;margin:auto}
.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:.72rem;font-weight:700;color:#b9c5ff}
h1{font-size:clamp(2.1rem,5vw,3.6rem);line-height:1.05;margin:14px 0}
.hero p{max-width:650px;color:#d5dcf5;font-size:1.05rem;line-height:1.7;margin:0}
.main{padding:0 22px 60px;margin-top:-30px}
.toolbar{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 220px;gap:12px}
input,select{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font:inherit;outline:none}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #4659d91c}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:25px 2px 15px;color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:0 5px 20px rgba(25,39,75,.035);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.top{display:flex;align-items:center;gap:13px;margin-bottom:17px}
.avatar{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#e0e6ff,#bfcaff);color:#293e9a;display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex-shrink:0}
.name{font-weight:750;font-size:1.04rem;line-height:1.3}
.role{font-size:.83rem;color:var(--muted);margin-top:4px}
.desc{font-size:.9rem;line-height:1.6;color:#59657a;min-height:44px;margin:0 0 18px}
.card-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:.72rem;font-weight:700;color:#4b5cc8;background:#eef0ff;padding:6px 9px;border-radius:99px}
.visit{color:var(--accent);font-size:.88rem;font-weight:750;text-decoration:none;white-space:nowrap}
.visit:hover{text-decoration:underline}
.empty{grid-column:1/-1;text-align:center;padding:55px 20px;color:var(--muted);background:white;border:1px dashed var(--line);border-radius:16px}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:25px}
footer a{color:var(--accent)}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:580px){.hero{padding:42px 20px 65px}.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.meta{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow">A curated directory</div>
    <h1>CT &amp; Github websites</h1>
    <p>Explore personal websites, academic profiles, research interests and professional work — all in one place.</p>
  </div>
</header>

<main class="main">
  <section class="toolbar" aria-label="Directory filters">
    <input id="search" type="search" placeholder="Search by name, role, research or keyword…" aria-label="Search profiles">
    <select id="category" aria-label="Filter by category">
      <option value="all">All categories</option>
      <option value="Faculty">Faculty</option>
      <option value="Research">Research</option>
      <option value="Staff">Staff</option>
      <option value="Student">Students</option>
      <option value="Other">Other</option>
    </select>
  </section>

  <div class="meta">
    <span id="count" aria-live="polite">0 profiles</span>
    <span>Choose a profile to visit its personal website ↗</span>
  </div>
  <section class="grid" id="directory" aria-label="Personal websites"></section>
</main>

<footer>
  Personal Website Directory · Add or update profiles in the <code>profiles</code> list in this file.
</footer>

<script>
/*
  EDIT THIS LIST:
  Replace the sample entries with real names and website URLs.
  category must be: Faculty, Research, Staff, Student, or Other.
*/
const profiles = [
  {
    name: "Dr. A. Example",
    role: "Associate Professor · Physics",
    category: "Faculty",
    description: "Research interests: condensed matter physics, nanomaterials and magnetism.",
    url: "https://digitalct.github.io/"
  },
  {
    name: "B. Researcher",
    role: "Research Scholar",
    category: "Research",
    description: "Research profile, publications, projects and academic activities.",
    url: "https://samuract.github.io/"
  },
  {
    name: "C. Example",
    role: "Technical Staff",
    category: "Staff",
    description: "Professional profile and laboratory support information.",
    url: "https://chengappagithub.github.io/"
  },
  {
    name: "C. Example",
    role: "Technical Staff",
    category: "Staff",
    description: "Professional profile and laboratory support information.",
    url: "https://ctdigitaldomain-leo.github.io/"
  },
   {
    name: "C. Example",
    role: "Technical Staff",
    category: "Staff",
    description: "Professional profile and laboratory support information.",
    url: " https://ctpersonaldomain.github.io/"
  },
   {
    name: "C. Example",
    role: "Technical Staff",
    category: "Staff",
    description: "Professional profile and laboratory support information.",
    url: " https://ctwellthify.github.io/"
  },
  {
    name: "C. Example",
    role: "Technical Staff",
    category: "Staff",
    description: "Professional profile and laboratory support information.",
    url: " https://ctwellthify.github.io/"
  },
  {
    name: "C. Example",
    role: "Technical Staff",
    category: "Staff",
    description: "Professional profile and laboratory support information.",
    url: "  https://ct2025.github.io/"
  },
   {
    name: "C. Example",
    role: "Technical Staff",
    category: "Staff",
    description: "Professional profile and laboratory support information.",
    url: "https://chengappathumisi-git.github.io/"
  },
  
];

const directory = document.getElementById("directory");
const search = document.getElementById("search");
const category = document.getElementById("category");
const count = document.getElementById("count");

function initials(name) {
  return name.trim().split(/\s+/).slice(0,2).map(part => part[0]).join("").toUpperCase();
}

function render() {
  const query = search.value.trim().toLowerCase();
  const selected = category.value;
  const filtered = profiles.filter(person => {
    const searchable = `${person.name} ${person.role} ${person.category} ${person.description}`.toLowerCase();
    return searchable.includes(query) && (selected === "all" || person.category === selected);
  });

  count.textContent = `${filtered.length} ${filtered.length === 1 ? "profile" : "profiles"}`;

  if (!filtered.length) {
    directory.innerHTML = '<div class="empty">No matching profiles. Try another search term or category.</div>';
    return;
  }

  directory.innerHTML = filtered.map(person => `
    <article class="card">
      <div class="top">
        <div class="avatar" aria-hidden="true">${initials(person.name)}</div>
        <div>
          <div class="name">${escapeHTML(person.name)}</div>
          <div class="role">${escapeHTML(person.role)}</div>
        </div>
      </div>
      <p class="desc">${escapeHTML(person.description)}</p>
      <div class="card-bottom">
        <span class="tag">${escapeHTML(person.category)}</span>
        <a class="visit" href="${safeURL(person.url)}" target="_blank" rel="noopener noreferrer">Visit website ↗</a>
      </div>
    </article>
  `).join("");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[char]);
}

function safeURL(value) {
  try {
    const url = new URL(value);
    return ["https:", "http:"].includes(url.protocol) ? escapeHTML(url.href) : "#";
  } catch {
    return "#";
  }
}

search.addEventListener("input", render);
category.addEventListener("change", render);
render();
</script>
</body>
</html>
